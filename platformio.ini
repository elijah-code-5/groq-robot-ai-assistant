// ------------------------------------------------------------
// Generic helpers
// ------------------------------------------------------------
String toLower(const String& s) {
  String result = s;
  for (int i = 0; i < result.length(); i++) result[i] = tolower((unsigned char)result[i]);
  return result;
}

String esc(const char* s) {
  String o;
  for (; *s; s++) {
    if (*s == '<') o += "&lt;";
    else if (*s == '>') o += "&gt;";
    else if (*s == '&') o += "&amp;";
    else if (*s == '"') o += "&quot;";
    else o += *s;
  }
  return o;
}

String escapeJson(const String& s) {
  String out;
  for (size_t i = 0; i < s.length(); i++) {
    char c = s[i];
    switch (c) {
      case '\\': out += "\\\\"; break;
      case '"': out += "\\\""; break;
      case '\n': out += "\\n"; break;
      case '\r': out += "\\r"; break;
      case '\t': out += "\\t"; break;
      default: out += c; break;
    }
  }
  return out;
}

void note(const String& m) {
  Serial.println(m);
  logLines[logN % LOG_N] = m;
  logN++;
}

void notef(const char* fmt, ...) {
  char b[200];
  va_list ap;
  va_start(ap, fmt);
  vsnprintf(b, sizeof(b), fmt, ap);
  va_end(ap);
  note(String(b));
}

// ------------------------------------------------------------
// Motor control using Freenove library
// ------------------------------------------------------------
void drive(int speed) {
  Motor_Move(speed, speed, speed, speed);
  driving = (speed != 0);
  driveStart = millis();
}

void motorStop() {
  Motor_Move(0, 0, 0, 0);
  driving = false;
}

void motorMove(int d1, int d2, int d3, int d4) {
  Motor_Move(d1, d2, d3, d4);
}

// ------------------------------------------------------------
// Storage helpers
// ------------------------------------------------------------
void savePods() {
  prefs.begin("pods", false);
  prefs.putBytes("p", pods, sizeof(pods));
  prefs.end();
  note("Podcasts saved to flash");
}

void loadPods() {
  memset(pods, 0, sizeof(pods));
  prefs.begin("pods", false);
  bool ok = (prefs.getBytesLength("p") == sizeof(pods));
  if (ok) prefs.getBytes("p", pods, sizeof(pods));
  prefs.end();
  if (!ok) {
    strlcpy(pods[0].name, DEFAULT_PODCAST_NAME, sizeof(pods[0].name));
    strlcpy(pods[0].url, DEFAULT_PODCAST_URL, sizeof(pods[0].url));
    savePods();
  }
}

void saveAlarms() {
  prefs.begin("alarms", false);
  prefs.putBytes("a", alarms, sizeof(alarms));
  prefs.end();
  note("Alarms saved to flash");
}

void loadAlarms() {
  memset(alarms, 0, sizeof(alarms));
  prefs.begin("alarms", false);
  size_t n = prefs.getBytesLength("a");
  bool ok = (n == sizeof(alarms));
  if (ok) prefs.getBytes("a", alarms, sizeof(alarms));
  prefs.end();
  if (!ok) {
    alarms[0] = { true, 7, 30, MODE_DAILY, 0, true, true, "" };
    strlcpy(alarms[0].msg, "Time to wake up.", sizeof(alarms[0].msg));
    saveAlarms();
  }
  for (int i = 0; i < MAX_ALARMS; i++) lastFired[i] = -1;
}

bool dayMatches(uint8_t mode, int wday) {
  switch (mode) {
    case MODE_ONCE:
    case MODE_DAILY: return true;
    case MODE_WEEKDAYS: return wday >= 1 && wday <= 5;
    case MODE_MON_SAT: return wday >= 1 && wday <= 6;
    default: return false;
  }
}

// ------------------------------------------------------------
// Audio system & podcast playback
// ------------------------------------------------------------
int btConnState() {
  if (!audioReady || !a2dp) return 0;
  auto src = a2dp->source();
  if (src.is_connected()) return 1;
  return 0;
}

bool ensureAudio() {
  if (audioReady) return true;
  notef("Starting Bluetooth. Looking for \"%s\". heap=%u", BT_SPEAKER_NAME, ESP.getFreeHeap());
  a2dp = new A2DPStream();
  auto cfg = a2dp->defaultConfig(TX_MODE);
  cfg.name = BT_SPEAKER_NAME;
  cfg.auto_reconnect = true;
  a2dp->begin(cfg);
  decoder = new EncodedAudioStream(a2dp, new MP3DecoderHelix());
  podUrl = new URLStream();
  podCopier = new StreamCopy(*decoder, *podUrl, 1024);
#if ENABLE_TTS || ENABLE_GROQ_TTS
  ttsUrl = new URLStream();
  ttsCopier = new StreamCopy(*decoder, *ttsUrl, 1024);
#endif
  audioReady = true;
  note("Bluetooth started, searching for speaker...");
  return true;
}

void stopAll() {
  if (audioReady) {
    if (decoder) decoder->end();
    if (podUrl) podUrl->end();
#if ENABLE_TTS || ENABLE_GROQ_TTS
    if (ttsUrl) ttsUrl->end();
#endif
  }
  stage = IDLE;
  pendingPod = -1;
  motorStop();
  driving = false;
  note("Stopped");
}

void beginPodcastNow(int idx) {
  notef("Opening stream: %s (heap %u)", pods[idx].name, ESP.getFreeHeap());
  bool ok = podUrl->begin(pods[idx].url, "audio/mpeg");
  if (!ok && strncmp(pods[idx].url, "https://", 8) == 0) {
    String alt = String("http://") + (pods[idx].url + 8);
    note("https failed, trying plain http...");
    podUrl->end();
    ok = podUrl->begin(alt.c_str(), "audio/mpeg");
  }
  if (!ok) {
    note("Could not open podcast link");
    stopAll();
    return;
  }
  decoder->begin();
  stage = PODCAST;
  gotAny = false;
  lastData = millis();
  note("Stream opened, waiting for audio data...");
}

void startPodcastStage(int idx) {
  if (idx < 0 || idx >= MAX_PODCASTS || strlen(pods[idx].url) < 8) {
    note("No URL in that podcast slot");
    stopAll();
    return;
  }
  ensureAudio();
  pendingPod = idx;
  pendingSince = millis();
  stage = WAITBT;
  note("Waiting for speaker to connect...");
}

#if ENABLE_TTS || ENABLE_GROQ_TTS
String jsonClean(const char* s) {
  String o;
  for (; *s; s++) o += (*s == '"' || *s == '\\' || *s < 32) ? ' ' : *s;
  return o;
}

bool startTTS(const String& text) {
  if (strlen(WIT_TOKEN) == 0) return false;
  ensureAudio();
  Serial.printf("[TTS] \"%s\" heap=%u\n", text.c_str(), ESP.getFreeHeap());
  String body = "{\"q\":\"" + jsonClean(text.c_str()) + "\",\"voice\":\"" + WIT_VOICE + "\"}";
  String auth = String("Bearer ") + WIT_TOKEN;
  ttsUrl->addRequestHeader("Authorization", auth.c_str());
  if (!ttsUrl->begin("https://api.wit.ai/synthesize?v=20240304", "audio/mpeg", POST,
                     "application/json", body.c_str())) {
    Serial.println("[TTS] request failed");
    return false;
  }
  decoder->begin();
  stage = TTS;
  gotAny = false;
  lastData = millis();
  return true;
}
#endif

void speakThenPlay(const String& text, int pod) {
  if (stage != IDLE) stopAll();
  wantPod = pod;
  alarmStart = millis();
#if ENABLE_TTS || ENABLE_GROQ_TTS
  if (startTTS(text)) return;
#endif
  if (pod >= 0) startPodcastStage(pod);
  else {
    note("Voice: " + text);
  }
}

void fireAlarm(int idx, const struct tm& t) {
  Alarm& a = alarms[idx];
  notef("ALARM #%d fired", idx + 1);
  if (a.roll) drive(DRIVE_SPEED);
  char tb[16];
  strftime(tb, sizeof(tb), "%I:%M %p", &t);
  String text = String("Good morning. The time is ") + tb + ". " + a.msg;
  speakThenPlay(text, a.podcast ? (int)a.podIdx : -1);
  if (a.mode == MODE_ONCE) {
    a.enabled = false;
    saveAlarms();
  }
}

// ------------------------------------------------------------
// Groq API integration
// ------------------------------------------------------------
String askGroq(const String& userText) {
  if (strlen(GROQ_API_KEY) < 10) {
    return "Groq API key is missing. Please configure GROQ_API_KEY in config.h.";
  }

  String prompt =
    "You are a helpful robot assistant on a robot alarm clock. "
    "You can control movement, answer time/day questions, play podcast requests, and explain the robot status. "
    "Keep answers short, practical, and robot-friendly. "
    "If the user asks to move, reply with a concise action instruction. "
    "If they ask about time or alarms, answer directly. "
    "User request: " + userText;

  WiFiClientSecure client;
  client.setInsecure();

  HTTPClient http;
  if (!http.begin(client, "https://api.groq.com/openai/v1/chat/completions")) {
    return "Could not connect to Groq.";
  }

  http.addHeader("Content-Type", "application/json");
  http.addHeader("Authorization", String("Bearer ") + GROQ_API_KEY);

  String body = "{"
    "\"model\":\"" + String(GROQ_MODEL) + "\","
    "\"messages\":[{\"role\":\"system\",\"content\":\"You are a robot assistant. Keep answers brief and helpful.\"},{\"role\":\"user\",\"content\":\"" + escapeJson(prompt) + "\"}],"
    "\"temperature\":0.7,"
    "\"max_tokens\":250"
    "}";

  int httpCode = http.POST(body);
  String payload = "";
  if (httpCode == HTTP_CODE_OK) {
    payload = http.getString();
  } else {
    payload = http.getString();
    http.end();
    return "Groq request failed: HTTP " + String(httpCode) + " payload=" + payload;
  }
  http.end();

  String needle = "\"content\":\"";
  int start = payload.indexOf(needle);
  if (start < 0) {
    return "Groq returned no usable content.";
  }
  start += needle.length();
  int end = payload.indexOf("\"", start);
  if (end < 0) {
    return "Groq returned malformed content.";
  }

  String result = payload.substring(start, end);
  String clean = "";
  for (size_t i = 0; i < result.length(); i++) {
    if (result[i] == '\\' && i + 1 < result.length()) {
      char next = result[i + 1];
      if (next == 'n') clean += '\n';
      else if (next == '"') clean += '"';
      else if (next == '\\') clean += '\\';
      else clean += next;
      i++;
    } else {
      clean += result[i];
    }
  }

  clean.trim();
  if (clean.length() == 0) return "No response from Groq.";
  return clean;
}

// ------------------------------------------------------------
// Voice command and AI handling
// ------------------------------------------------------------
void processVoiceCommand(const String& command) {
  String cmd = command;
  cmd.trim();
  String cmdLower = toLower(cmd);

  size_t pos = cmdLower.indexOf("hey robot");
  if (pos != -1) cmdLower = cmdLower.substring(pos + 10);
  pos = cmdLower.indexOf("ok robot");
  if (pos != -1) cmdLower = cmdLower.substring(pos + 9);
  pos = cmdLower.indexOf("hey assistant");
  if (pos != -1) cmdLower = cmdLower.substring(pos + 13);
  pos = cmdLower.indexOf("alexa");
  if (pos != -1) cmdLower = cmdLower.substring(pos + 5);
  cmdLower.trim();

  if (cmdLower.indexOf("go") != -1 || cmdLower.indexOf("forward") != -1) {
    drive(DRIVE_SPEED);
    note("Voice: Moving forward");
    return;
  }
  if (cmdLower.indexOf("back") != -1 || cmdLower.indexOf("backward") != -1) {
    drive(-DRIVE_SPEED);
    note("Voice: Moving backward");
    return;
  }
  if (cmdLower.indexOf("left") != -1 || cmdLower.indexOf("turn left") != -1) {
    Motor_Move(-DRIVE_SPEED, -DRIVE_SPEED, DRIVE_SPEED, DRIVE_SPEED);
    driving = true;
    driveStart = millis();
    note("Voice: Turning left");
    return;
  }
  if (cmdLower.indexOf("right") != -1 || cmdLower.indexOf("turn right") != -1) {
    Motor_Move(DRIVE_SPEED, DRIVE_SPEED, -DRIVE_SPEED, -DRIVE_SPEED);
    driving = true;
    driveStart = millis();
    note("Voice: Turning right");
    return;
  }
  if (cmdLower.indexOf("stop") != -1 || cmdLower.indexOf("halt") != -1) {
    stopAll();
    note("Voice: Stopped");
    return;
  }
  if (cmdLower.indexOf("play podcast") != -1) {
    for (int i = 0; i < MAX_PODCASTS; i++) {
      if (strlen(pods[i].url) > 0) {
        String podName = toLower(String(pods[i].name));
        if (cmdLower.indexOf(podName) != -1 || cmdLower.indexOf(String(i + 1)) != -1) {
          if (stage != IDLE) stopAll();
          startPodcastStage(i);
          notef("Voice: Playing podcast %d: %s", i + 1, pods[i].name);
          return;
        }
      }
    }
    if (strlen(pods[0].url) > 0) {
      if (stage != IDLE) stopAll();
      startPodcastStage(0);
      note("Voice: Playing first podcast");
    }
    return;
  }
  if (cmdLower.indexOf("stop podcast") != -1 || cmdLower.indexOf("pause") != -1) {
    stopAll();
    note("Voice: Stopped podcast");
    return;
  }
  if (cmdLower.indexOf("what time") != -1 || cmdLower.indexOf("current time") != -1) {
    struct tm t;
    if (getLocalTime(&t, 10)) {
      char tb[16];
      strftime(tb, sizeof(tb), "%I:%M %p", &t);
      note("Voice: The time is " + String(tb));
    } else {
      note("Voice: Time not available");
    }
    return;
  }
  if (cmdLower.indexOf("what day") != -1 || cmdLower.indexOf("today") != -1) {
    struct tm t;
    if (getLocalTime(&t, 10)) {
      const char* days[] = {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"};
      note("Voice: Today is " + String(days[t.tm_wday]));
    } else {
      note("Voice: Date not available");
    }
    return;
  }

  processAIQuery(cmdLower);
}

void processAIQuery(const String& query) {
  String q = toLower(query);

  for (int i = 0; i < MAX_PODCASTS; i++) {
    if (strlen(pods[i].url) == 0) continue;
    String podName = toLower(String(pods[i].name));
    if (q.indexOf(podName) != -1 || q.indexOf("podcast") != -1) {
      if (q.indexOf("play") != -1 || q.indexOf("start") != -1) {
        if (stage != IDLE) stopAll();
        startPodcastStage(i);
        notef("AI: Playing podcast %d: %s", i + 1, pods[i].name);
        return;
      }
    }
  }

  if (q.indexOf("move") != -1 || q.indexOf("drive") != -1 || q.indexOf("go") != -1) {
    if (q.indexOf("forward") != -1) {
      drive(DRIVE_SPEED);
      note("AI: Moving forward");
      return;
    }
    if (q.indexOf("back") != -1) {
      drive(-DRIVE_SPEED);
      note("AI: Moving backward");
      return;
    }
    if (q.indexOf("left") != -1) {
      Motor_Move(-DRIVE_SPEED, -DRIVE_SPEED, DRIVE_SPEED, DRIVE_SPEED);
      driving = true;
      driveStart = millis();
      note("AI: Turning left");
      return;
    }
    if (q.indexOf("right") != -1) {
      Motor_Move(DRIVE_SPEED, DRIVE_SPEED, -DRIVE_SPEED, -DRIVE_SPEED);
      driving = true;
      driveStart = millis();
      note("AI: Turning right");
      return;
    }
    drive(DRIVE_SPEED);
    note("AI: Moving forward");
    return;
  }

  if (q.indexOf("stop") != -1 || q.indexOf("halt") != -1) {
    stopAll();
    note("AI: Stopped all actions");
    return;
  }

  if (q.indexOf("time") != -1) {
    struct tm t;
    if (getLocalTime(&t, 10)) {
      char tb[16];
      strftime(tb, sizeof(tb), "%I:%M %p", &t);
      note("AI: The time is " + String(tb));
    } else {
      note("AI: Time not available");
    }
    return;
  }

  if (q.indexOf("date") != -1 || q.indexOf("day") != -1) {
    struct tm t;
    if (getLocalTime(&t, 10)) {
      const char* days[] = {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"};
      const char* months[] = {"January", "February", "March", "April", "May", "June",
                             "July", "August", "September", "October", "November", "December"};
      char db[32];
      snprintf(db, sizeof(db), "%s, %s %d, %d", days[t.tm_wday], months[t.tm_mon], t.tm_mday, t.tm_year + 1900);
      note("AI: Today is " + String(db));
    } else {
      note("AI: Date not available");
    }
    return;
  }

  if (q.indexOf("alarm") != -1) {
    if (q.indexOf("set") != -1 || q.indexOf("create") != -1) {
      note("AI: To set an alarm, use the web interface at http://" + WiFi.localIP().toString());
      return;
    }
    if (q.indexOf("list") != -1 || q.indexOf("show") != -1) {
      String alarmList = "AI: Active alarms: ";
      for (int i = 0; i < MAX_ALARMS; i++) {
        if (alarms[i].enabled) {
          alarmList += String("#") + (i + 1) + " at " + String(alarms[i].hour) + ":" + String(alarms[i].minute) + " ";
        }
      }
      if (alarmList.indexOf("#") == -1) alarmList += "None";
      note(alarmList);
      return;
    }
  }

  String answer = askGroq(query);
  note("AI: " + answer);

  if (ENABLE_GROQ_TTS && answer.length() > 0) {
    speakThenPlay(answer, -1);
  }
}

// ------------------------------------------------------------
// Web interface
// ------------------------------------------------------------
bool auth() {
#if REQUIRE_LOGIN
  if (!server.authenticate(WEB_USER, WEB_PASS)) {
    server.requestAuthentication();
    return false;
  }
#endif
  return true;
}

String podOptions(int sel) {
  String o;
  for (int i = 0; i < MAX_PODCASTS; i++) {
    if (strlen(pods[i].url) < 8) continue;
    o += "<option value=" + String(i) + (i == sel ? " selected>" : ">") + esc(pods[i].name) + "</option>";
  }
  return o;
}

void redirectHome() {
  if (server.hasArg("x")) {
    server.send(200, "text/plain", "ok");
    return;
  }
  server.sendHeader("Location", "/");
  server.send(303);
}

const char* stateName() {
  switch (stage) {
    case TTS: return "speaking";
    case PODCAST: return "playing";
    case WAITBT: return "connecting speaker";
    default: return "idle";
  }
}

const char* speakerName() {
  if (!audioReady) return "off";
  int c = btConnState();
  return c == 1 ? "connected" : c == 0 ? "searching..." : "started";
}

void handleStatus() {
  struct tm t;
  char tb[24] = "syncing";
  if (getLocalTime(&t, 10)) strftime(tb, sizeof(tb), "%a %H:%M:%S", &t);
  String j = String("{\"time\":\"") + tb + "\",\"state\":\"" + stateName() +
             "\",\"speaker\":\"" + speakerName() +
             "\",\"heap\":" + String(ESP.getFreeHeap()) + ",\"log\":[";
  int n = logN < LOG_N ? logN : LOG_N;
  for (int k = 1; k <= n; k++) {
    String m = logLines[(logN - k) % LOG_N];
    m.replace("\"", "'");
    m.replace("\\", "/");
    if (k > 1) j += ",";
    j += "\"" + m + "\"";
  }
  j += "]}";
  server.send(200, "application/json", j);
}

