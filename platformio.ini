*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif}.wrap{max-width:700px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h1{font-size:20px;margin:0}h3{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--input);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}.chip b{color:var(--accent)}button,.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:2px;touch-action:manipulation}button.alt,.btn.alt{background:var(--input);color:var(--text);border:1px solid var(--line)}.stop{background:var(--bad);width:100%;font-size:20px;padding:14px;margin:12px 0 0}.pad{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,76px);gap:8px;justify-content:center;user-select:none}.pad button{margin:0;font-size:28px;padding:0}input[type=text],input[type=time],input[type=number],select{background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;color-scheme:dark light}input[type=text]{width:100%;margin:4px 0}form.row{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}label{margin-right:10px;font-size:14px}#log{font:12px/1.6 ui-monospace,monospace;color:var(--muted);white-space:pre-wrap;word-break:break-word}#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--card);color:var(--text);border:1px solid var(--line);padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}#voiceInput{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--text);font-size:15px}</style></head><body><div class="wrap"><header><h1>🤖 Robot Alarm Clock v8</h1><button class="alt" id="theme">Dark / Light</button></header><div class="card"><div class="chips"><span class="chip">Time <b id="t">--</b></span><span class="chip">State <b id="st">--</b></span><span class="chip">Speaker <b id="sp">--</b></span><span class="chip">Memory <b id="hp">--</b></span></div></div>)rawliteral";

const char PAGE_MID[] PROGMEM = R"rawliteral(
<div class="card"><h3>Voice Assistant</h3><input type="text" id="voiceInput" placeholder="Type voice command here..."><button onclick="sendVoice()">Send Command</button><div style="margin-top:8px;font-size:13px;color:var(--muted)">Try: "hey robot go", "play podcast 1", "what time is it"</div></div>
<div class="card"><h3>Drive (hold a button)</h3><div class="pad"><span></span><button data-d="f">▲</button><span></span><button data-d="l">◀</button><button data-d="s" class="alt">■</button><button data-d="r">▶</button><span></span><button data-d="b">▼</button><span></span></div><button class="stop" id="stop">STOP EVERYTHING</button></div>
<div class="card"><h3>Speaker &amp; Timer</h3><button data-act="/btstart">Connect Speaker</button><form action="/timer" style="margin-top:8px">Timer <input type="number" name="min" min="1" max="999" style="width:80px" placeholder="min"> <button>Start</button> <a class="btn alt" href="/timer?min=0">Cancel</a></form></div>
<div class="card"><h3>Podcasts</h3>)rawliteral";

const char PAGE_TAIL[] PROGMEM = R"rawliteral(
</div><div class="card"><h3>Alarms</h3>)rawliteral";

const char PAGE_END[] PROGMEM = R"rawliteral(
</div><div class="card"><h3>Activity Log</h3><div id="log">...</div></div><div id="toast"></div></div><script>
const $=s=>document.querySelector(s);
function toast(m){const e=$('#toast');e.textContent=m;e.style.opacity=1;clearTimeout(window._t);window._t=setTimeout(()=>{e.style.opacity=0},1800)}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}};try{setTheme(localStorage.getItem('theme')||'dark')}catch(e){}
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark');
function cmd(u,m){fetch(u+(u.includes('?')?'&':'?')+'x=1').then(r=>r.text()).then(()=>{if(m)toast(m)}).catch(()=>toast('No answer'))}
const names={f:'Forward',b:'Back',l:'Left',r:'Right',s:'Halt'};
document.querySelectorAll('.pad button').forEach(b=>{const d=b.dataset.d;b.addEventListener('pointerdown',e=>{e.preventDefault();cmd('/drive?d='+d,names[d])});if(d!='s'){const end=()=>cmd('/drive?d=s');['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,end))}});
$('#stop').onclick=()=>cmd('/stop','Stopped');
function sendVoice(){const input=$('#voiceInput');const cmd=input.value.trim();if(cmd){fetch('/voice?cmd='+encodeURIComponent(cmd)+'&x=1').then(r=>r.text()).then(()=>{toast('Sent: '+cmd);input.value=''}).catch(()=>toast('Error'))}}
$('#voiceInput').addEventListener('keypress',function(e){if(e.key==='Enter'){e.preventDefault();sendVoice()}});
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>cmd(b.dataset.act,'Sent'));
function poll(){fetch('/status').then(r=>r.json()).then(s=>{$('#t').textContent=s.time;$('#st').textContent=s.state;$('#sp').textContent=s.speaker;$('#hp').textContent=Math.round(s.heap/1024)+' KB';$('#log').textContent=s.log.join('\n')||'(nothing)'}).catch(()=>{$('#st').textContent='offline'})}
poll();setInterval(poll,1500);</script></body></html>)rawliteral";

void handleRoot() {
  if (!auth()) return;
  server.setContentLength(CONTENT_LENGTH_UNKNOWN);
  server.send(200, "text/html", "");
  server.sendContent(PAGE_HEAD);
  server.sendContent(PAGE_MID);
  for (int i = 0; i < MAX_PODCASTS; i++) {
    String h = "<form class=row method=POST action=/podsave><input type=hidden name=i value=" + String(i) + "><b>#" + String(i + 1) + "</b>";
    h += "<input type=text name=name maxlength=31 placeholder='Name' value=\"" + esc(pods[i].name) + "\">";
    h += "<input type=text name=url maxlength=255 placeholder='MP3 URL' value=\"" + esc(pods[i].url) + "\">";
    h += "<button>Save</button><button type=button class=alt data-act='/play?p=" + String(i) + "'>▶</button></form>";
    server.sendContent(h);
  }
  server.sendContent(PAGE_TAIL);
  for (int i = 0; i < MAX_ALARMS; i++) {
    Alarm& a = alarms[i];
    char tv[8];
    snprintf(tv, sizeof(tv), "%02d:%02d", a.hour, a.minute);
    String h = "<form class=row method=POST action=/save><input type=hidden name=i value=" + String(i) + ">";
    h += "<b>Alarm " + String(i + 1) + "</b> <input type=time name=t value=" + tv + "> <select name=mode>";
    for (int m = 0; m < 5; m++) h += "<option value=" + String(m) + (a.mode == m ? " selected>" : ">") + MODE_NAMES[m] + "</option>";
    h += "</select><br><label><input type=checkbox name=en" + String(a.enabled ? " checked" : "") + "> on</label>";
    h += "<label><input type=checkbox name=pod" + String(a.podcast ? " checked" : "") + "> podcast</label><select name=pi>" + podOptions(a.podIdx) + "</select> ";
    h += "<label><input type=checkbox name=roll" + String(a.roll ? " checked" : "") + "> roll</label>";
    h += "<input type=text name=msg maxlength=47 placeholder='Message' value=\"" + esc(a.msg) + "\">";
    h += "<button>Save</button><button type=button class=alt data-act='/test?i=" + String(i) + "'>Test</button></form>";
    server.sendContent(h);
  }
  server.sendContent(PAGE_END);
  server.sendContent("");
}

void handleSave() {
  if (!auth()) return;
  int i = server.arg("i").toInt();
  if (i < 0 || i >= MAX_ALARMS) return redirectHome();
  Alarm& a = alarms[i];
  String ts = server.arg("t");
  if (ts.length() >= 5) {
    a.hour = constrain(ts.substring(0, 2).toInt(), 0, 23);
    a.minute = constrain(ts.substring(3, 5).toInt(), 0, 59);
  }
  a.mode = constrain(server.arg("mode").toInt(), 0, 4);
  a.enabled = server.hasArg("en") && a.mode != MODE_OFF;
  a.podcast = server.hasArg("pod");
  a.roll = server.hasArg("roll");
  a.podIdx = constrain(server.arg("pi").toInt(), 0, MAX_PODCASTS - 1);
  strlcpy(a.msg, server.arg("msg").c_str(), sizeof(a.msg));
  lastFired[i] = -1;
  saveAlarms();
  redirectHome();
}

void handleTest() {
  if (!auth()) return;
  int i = server.arg("i").toInt();
  struct tm t;
  if (i >= 0 && i < MAX_ALARMS && getLocalTime(&t, 100)) {
    uint8_t keep = alarms[i].mode;
    alarms[i].mode = MODE_DAILY;
    fireAlarm(i, t);
    alarms[i].mode = keep;
  }
  redirectHome();
}

void handleTimer() {
  if (!auth()) return;
  int m = server.arg("min").toInt();
  if (m > 0) {
    countdownEnd = millis() + (unsigned long)m * 60000UL;
    timerActive = true;
  } else {
    timerActive = false;
  }
  redirectHome();
}

void handleDrive() {
  if (!auth()) return;
  String d = server.arg("d");
  if (d == "f") drive(DRIVE_SPEED);
  else if (d == "b") drive(-DRIVE_SPEED);
  else if (d == "l") {
    Motor_Move(-DRIVE_SPEED, -DRIVE_SPEED, DRIVE_SPEED, DRIVE_SPEED);
    driving = true;
    driveStart = millis();
  } else if (d == "r") {
    Motor_Move(DRIVE_SPEED, DRIVE_SPEED, -DRIVE_SPEED, -DRIVE_SPEED);
    driving = true;
    driveStart = millis();
  } else {
    motorStop();
    driving = false;
  }
  redirectHome();
}

void handlePodSave() {
  if (!auth()) return;
  int i = server.arg("i").toInt();
  if (i >= 0 && i < MAX_PODCASTS) {
    String u = server.arg("url");
    u.trim();
    strlcpy(pods[i].name, server.arg("name").c_str(), sizeof(pods[i].name));
    strlcpy(pods[i].url, u.c_str(), sizeof(pods[i].url));
    savePods();
  }
  redirectHome();
}

void handlePlay() {
  if (!auth()) return;
  int i = server.arg("p").toInt();
  if (stage != IDLE) stopAll();
  wantPod = -1;
  alarmStart = millis();
  startPodcastStage(i);
  redirectHome();
}

void handleVoice() {
  if (!auth()) return;
  String cmd = server.arg("cmd");
  if (cmd.length() > 0) processVoiceCommand(cmd);
  server.send(200, "text/plain", "ok");
}

void handlePing() {
  server.send(200, "text/plain", "pong");
}

void onWiFiEvent(WiFiEvent_t event, WiFiEventInfo_t info) {
  if (event == ARDUINO_EVENT_WIFI_STA_DISCONNECTED) {
    uint8_t r = info.wifi_sta_disconnected.reason;
    Serial.printf("[WiFi] disconnected, reason %u%s\n", r,
      r == 201 ? " (network not found)" : (r == 202 || r == 15) ? " (wrong password?)" : "");
  }
}

void handleSerial() {
  if (!Serial.available()) return;
  char c = Serial.read();
  if (c == 'f') drive(DRIVE_SPEED);
  if (c == 'b') drive(-DRIVE_SPEED);
  if (c == 's') stopAll();
  if (c == 'p') {
    if (stage != IDLE) stopAll();
    wantPod = -1;
    alarmStart = millis();
    startPodcastStage(0);
  }
  static String voiceCmd = "";
  if (c == 'v' || c == 'V') {
    voiceCmd = "";
    while (Serial.available()) {
      char next = Serial.read();
      if (next == '\n' || next == '\r') break;
      voiceCmd += next;
    }
    if (voiceCmd.length() > 0) processVoiceCommand(voiceCmd);
  }
}

void setup() {
  Serial.begin(115200);
  delay(500);
  Serial.println("\n=== Robot Alarm Clock + Groq Assistant ===");

  pinMode(0, INPUT_PULLUP);

  Serial.println("[Motors] Initializing Freenove 4WD Car Kit...");
  PCA9685_Setup();
  motorStop();
  Serial.println("[Motors] Freenove kit initialized");

  loadAlarms();
  loadPods();

  WiFi.persistent(false);
  WiFi.onEvent(onWiFiEvent);
  WiFi.setHostname("robot-alarm");
  WiFi.mode(WIFI_STA);
  WiFi.setAutoReconnect(true);
  WiFi.begin(WIFI_SSID_ACTUAL, WIFI_PASS_ACTUAL);

  Serial.print("[WiFi] Connecting");
  unsigned long t0 = millis();
  while (WiFi.status() != WL_CONNECTED) {
    delay(500);
    Serial.print(".");
    if (millis() - t0 > 20000) {
      Serial.println("\n[WiFi] retrying...");
      WiFi.disconnect();
      WiFi.begin(WIFI_SSID_ACTUAL, WIFI_PASS_ACTUAL);
      t0 = millis();
    }
  }

  configTime(GMT_OFFSET_S, 0, "pool.ntp.org", "time.google.com");
  MDNS.begin("alarm");

  server.on("/status", handleStatus);
  server.on("/ping", handlePing);
  server.on("/", handleRoot);
  server.on("/save", HTTP_POST, handleSave);
  server.on("/test", handleTest);
  server.on("/timer", handleTimer);
  server.on("/drive", handleDrive);
  server.on("/podsave", HTTP_POST, handlePodSave);
  server.on("/play", handlePlay);
  server.on("/voice", handleVoice);
  server.on("/btstart", []() { if (!auth()) return; ensureAudio(); redirectHome(); });
  server.on("/stop", []() { if (!auth()) return; stopAll(); timerActive = false; redirectHome(); });

  server.begin();
  Serial.print("\n>>> Web: http://");
  Serial.print(WiFi.localIP());
  Serial.println("/");
}

void loop() {
  server.handleClient();
  handleSerial();

  static unsigned long lastNet = 0;
  if (millis() - lastNet > 30000) {
    lastNet = millis();
    if (WiFi.status() != WL_CONNECTED) {
      Serial.println("[WiFi] lost, reconnecting...");
      WiFi.disconnect();
      WiFi.begin(WIFI_SSID_ACTUAL, WIFI_PASS_ACTUAL);
    }
  }

  static unsigned long btnDown = 0;
  if (digitalRead(0) == LOW) {
    if (!btnDown) btnDown = millis();
    if (millis() - btnDown > 60 && stage != IDLE) stopAll();
  } else btnDown = 0;

  if (stage == WAITBT) {
    int c = btConnState();
    if (c != 0 && pendingPod >= 0) {
      if (c == 1) note("Speaker connected.");
      int i = pendingPod;
      pendingPod = -1;
      beginPodcastNow(i);
    } else if (millis() - pendingSince > 30000) {
      note("Speaker did not connect in 30s.");
      stopAll();
    }
  }

  if (audioReady && (stage == TTS || stage == PODCAST)) {
    StreamCopy* c = podCopier;
#if ENABLE_TTS || ENABLE_GROQ_TTS
    if (stage == TTS) c = ttsCopier;
#endif
    size_t n = c->copy();
    if (n > 0) {
      lastData = millis();
      if (!gotAny) {
        gotAny = true;
        auto ai = decoder->audioInfo();
        notef("Audio: %u Hz, %u ch", (unsigned)ai.sample_rate, (unsigned)ai.channels);
      }
    }
    unsigned long idleLimit = gotAny ? (stage == TTS ? 2000 : 8000) : 10000;
    if (millis() - lastData > idleLimit) {
#if ENABLE_TTS || ENABLE_GROQ_TTS
      if (stage == TTS) {
        decoder->end();
        ttsUrl->end();
        if (wantPod >= 0) startPodcastStage(wantPod);
        else stage = IDLE;
      } else
#endif
      {
        stopAll();
      }
    }
    if (stage == PODCAST && millis() - alarmStart > ALARM_MAX_MS) stopAll();
  }

  if (driving && millis() - driveStart > DRIVE_MS) {
    motorStop();
    driving = false;
  }

  if (timerActive && (long)(millis() - countdownEnd) >= 0) {
    timerActive = false;
    drive(DRIVE_SPEED);
    speakThenPlay("Your timer is done.", -1);
  }

  static unsigned long lastCheck = 0;
  if (millis() - lastCheck > 1000) {
    lastCheck = millis();
    struct tm t;
    if (getLocalTime(&t, 10)) {
      if (!audioReady) {
        int nowMin = t.tm_hour * 60 + t.tm_min;
        for (int i = 0; i < MAX_ALARMS; i++) {
          Alarm& a = alarms[i];
          if (a.enabled && a.podcast && dayMatches(a.mode, t.tm_wday)) {
            int diff = a.hour * 60 + a.minute - nowMin;
            if (diff >= 0 && diff <= BT_PREWARM_MIN) {
              ensureAudio();
              break;
            }
          }
        }
      }
      int32_t stamp = ((t.tm_year * 366) + t.tm_yday) * 1440 + t.tm_hour * 60 + t.tm_min;
      for (int i = 0; i < MAX_ALARMS; i++) {
        Alarm& a = alarms[i];
        if (a.enabled && a.hour == t.tm_hour && a.minute == t.tm_min &&
            dayMatches(a.mode, t.tm_wday) && lastFired[i] != stamp) {
          lastFired[i] = stamp;
          fireAlarm(i, t);
          break;
        }
      }
    }
  }
}
